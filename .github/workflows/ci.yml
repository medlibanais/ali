# CI for PrayerLock (GROW).
# Runs on every push to main, on pull requests into main, and by hand.
# deploy.yml only deploys to Netlify when this whole workflow succeeds on a
# push to main, so every job here is a gate for the live site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches, never on main (deploy needs them).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '20'
  # Expo CLI: no interactive prompts, no telemetry.
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  # ------------------------------------------------------------------
  # 1. TypeScript, unit tests and a web export smoke test
  # ------------------------------------------------------------------
  checks:
    name: Typecheck, unit tests, web export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Avatar model files must match src/avatar/modelManifest.ts and stay
      # under assets/avatar3d/budget.json. Growth fails the run until the
      # budget is raised on purpose in the same PR.
      - name: Avatar asset size budget
        run: node scripts/avatar-assets.mjs --check

      # Any TypeScript error exits non-zero and fails the run.
      - name: Typecheck (npx tsc --noEmit)
        run: npx tsc --noEmit

      - name: Typecheck Detox tests
        if: hashFiles('mobile/e2e/tsconfig.json') != ''
        run: npx tsc -p e2e

      - name: Unit tests (npx jest)
        run: npx jest --ci

      # The project rule: the web export must build. Placeholder values are
      # enough to bundle; deploy.yml uses the real ones from secrets.
      - name: Web export smoke test
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: |
          npx expo export -p web --output-dir dist-check
          test -f dist-check/index.html
          test -f dist-check/_redirects
          test -f dist-check/.nojekyll
          grep -q '/index.html' dist-check/_redirects

  # ------------------------------------------------------------------
  # 2. API end-to-end tests (tests/e2e.ps1) against a local Supabase
  # ------------------------------------------------------------------
  e2e-api:
    name: E2E (tests/e2e.ps1 on local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # The repo root pins the Supabase CLI version used locally.
      - name: Install Supabase CLI
        run: npm ci --no-audit --no-fund

      # Applies every migration and seed.sql. Mailpit (port 54324) stays on:
      # the password-reset flow reads the reset email from it.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime

      - name: Run tests/e2e.ps1
        shell: pwsh
        run: ./tests/e2e.ps1

      - name: Supabase logs on failure
        if: failure()
        run: docker ps -a && docker logs $(docker ps -aqf name=supabase_auth) --tail 100 || true

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup || true

  # ------------------------------------------------------------------
  # 3. Detox journey test on an Android emulator
  # ------------------------------------------------------------------
  detox-android:
    name: Detox (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVD_NAME: Pixel_7_API_34
      # Detox reads this to pick the emulator (see mobile/.detoxrc.js).
      DETOX_AVD: Pixel_7_API_34
      # The emulator is x86_64: building one ABI halves the native build.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
    steps:
      - uses: actions/checkout@v4

      # Detox lands with PR #35. Until mobile/.detoxrc.js is on the branch
      # this job reports "skipped" in its summary and passes.
      - name: Check for Detox setup
        id: detox
        run: |
          if [ -f mobile/.detoxrc.js ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Detox skipped::mobile/.detoxrc.js not found (Detox setup from PR #35 is not on this branch yet)."
            echo "### Detox skipped: mobile/.detoxrc.js is not on this branch yet" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The emulator, Gradle and the Supabase containers together need more
      # disk than a fresh runner has free.
      - name: Free disk space
        if: steps.detox.outputs.present == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Enable KVM (hardware acceleration for the emulator)
        if: steps.detox.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        if: steps.detox.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # Gradle 8.8 (Expo SDK 51) needs Java 17-21.
      - uses: actions/setup-java@v4
        if: steps.detox.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.detox.outputs.present == 'true'

      - name: Install dependencies
        if: steps.detox.outputs.present == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix mobile

      # The test app talks to this local stack (10.0.2.2 from the emulator)
      # and confirms sign-up emails through Mailpit.
      - name: Start local Supabase
        if: steps.detox.outputs.present == 'true'
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime

      - name: Build the Release app for Detox
        if: steps.detox.outputs.present == 'true'
        working-directory: mobile
        run: npx detox build -c android.emu.release

      - name: AVD cache
        if: steps.detox.outputs.present == 'true'
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis

      - name: Create AVD snapshot for the cache
        if: steps.detox.outputs.present == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Run Detox tests on the emulator
        if: steps.detox.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile
          script: npx detox test -c android.emu.release --headless --cleanup --record-logs failing --take-screenshots failing

      - name: Upload Detox artifacts on failure
        if: failure() && steps.detox.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: mobile/e2e/artifacts
          retention-days: 7

      - name: Stop Supabase
        if: always() && steps.detox.outputs.present == 'true'
        run: npx supabase stop --no-backup || true
